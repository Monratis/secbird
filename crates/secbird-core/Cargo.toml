[package]
name = "secbird-core"
description = "Talk to Razer peripherals over USB HID (Protocol 2.5)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Devices_Enumeration", "Devices_Lights", "Foundation_Collections", "Win32_System_WinRT"] }
winreg = "0.52"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
hidapi = "2.6"
